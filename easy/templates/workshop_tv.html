<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel da Oficina · Modo TV</title>
<link rel="stylesheet" href="{{ url_for('static',filename='workshop_tv.css',v=12) }}">
<script src="{{ url_for('static',filename='workshop_tv.js',v=5) }}" defer></script>
</head>
<body class="{{ 'tv-admin' if current_user.role == 'admin' else 'tv-team' }}">
<header class="tv-header">
  <div class="tv-brand"><img src="{{ url_for('static',filename='logo.png') }}" alt=""><h1>Painel da Oficina <span>· Modo TV</span></h1></div>
  <nav>
    <button id="fullscreen" type="button" hidden>Tela cheia</button>
    {% if current_user.role == 'admin' %}
      <a href="{{ url_for('web.dashboard') }}">Voltar</a>
    {% else %}
      <form method="post" action="{{ url_for('web.logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit">Sair</button>
      </form>
    {% endif %}
  </nav>
</header>
<main id="tv" data-url="{{ url_for('web.workshop_tv_data') }}">
  <section class="tv-overview">
    <div><h2>Veículos em atendimento</h2>
      <p class="tv-profile">{{ 'Administrador' if current_user.role == 'admin' else 'Equipe' }} · {{ current_user.name }}</p>
      <p id="sync" role="status">Carregando ordens de serviço…</p></div>
    <div class="tv-counts"><div><strong id="open">—</strong> OS abertas</div><div class="late"><strong id="late">—</strong> em atraso</div></div>
  </section>
  <div id="cards"><p class="tv-empty">Buscando atendimentos…</p></div>
  <nav class="tv-footer" id="tv-pagination" aria-label="Páginas de ordens de serviço">
    <button id="page-back" type="button" aria-label="Página anterior" disabled>←</button>
    <span id="page" role="status"></span>
    <button id="page-next" type="button" aria-label="Próxima página" disabled>→</button>
  </nav>
  <noscript>Ative o JavaScript para acompanhar as OS em tempo real.</noscript>
</main>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel da Oficina · Modo TV</title>
<link rel="stylesheet" href="{{ url_for('static',filename='workshop_tv.css',v=4) }}">
<script src="{{ url_for('static',filename='workshop_tv.js',v=4) }}" defer></script>
</head>
<body>
<header class="tv-header">
  <div class="tv-brand"><img src="{{ url_for('static',filename='logo.png') }}" alt=""><h1>Painel da Oficina <span>· Modo TV</span></h1></div>
  <nav><button id="fullscreen" type="button" hidden>Tela cheia</button><a href="{{ url_for('web.dashboard') }}">Voltar</a></nav>
</header>
<main id="tv" data-url="{{ url_for('web.workshop_tv_data') }}">
  <section class="tv-overview">
    <div><h2>Veículos em atendimento</h2><p id="sync" role="status">Carregando ordens de serviço…</p></div>
    <div class="tv-counts"><div><strong id="open">—</strong> OS abertas</div><div class="late"><strong id="late">—</strong> em atraso</div></div>
  </section>
  <div id="cards"><p class="tv-empty">Buscando atendimentos…</p></div>
  <div class="tv-footer"><span id="page"></span><span id="rotation">Atualização automática a cada 10 segundos</span></div>
  <noscript>Ative o JavaScript para acompanhar as OS em tempo real.</noscript>
</main>
</body>
</html>

{% extends 'base.html' %}{% block content %}<div class="heading"><h1>Usuários</h1><a class="button" href="{{ url_for('web.user_form') }}">+ Novo usuário</a></div><div class="panel table-wrap"><table><thead><tr><th>Nome</th><th>Login</th><th>Perfil</th><th>Situação</th><th></th></tr></thead><tbody>{% for u in users %}<tr><td>{{ u.name }}</td><td>{{ u.username }}</td><td>{{ u.role }}</td><td>{{ 'Ativo' if u.active else 'Inativo' }}</td><td><a href="{{ url_for('web.user_form',ident=u.id) }}">Editar</a></td></tr>{% endfor %}</tbody></table></div>{% endblock %}
